<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070913">
<title>Apoio Técnico</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root{
  --bg:#070913;
  --surface:#0b1124;
  --surface2:#111936;
  --border:rgba(59,130,246,.2);
  --border2:rgba(59,130,246,.4);
  --accent:#3b82f6;
  --accent-glow:rgba(59,130,246,.3);
  --green:#10b981;
  --green2:#34d399;
  --red:#ef4444;
  --warn:#f59e0b;
  --text:#f3f4f6;
  --text2:#d1d5db;
  --muted:#9ca3af;
  --dim:#4b5563;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-xs:4px;--r-sm:8px;--r-md:12px;
  --safe-b:max(env(safe-area-inset-bottom,0px),12px);
  --safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:radial-gradient(circle at top,rgba(59,130,246,.08),transparent 55%),var(--bg);
  color:var(--text);
  font-family:var(--font);
  overflow-x:hidden;
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{
  font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
button:active{opacity:.8;transform:scale(.97)}
input,select{font-family:var(--font);outline:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:9px}

.hdr{
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid var(--border2);
  background:rgba(7,9,19,.95);
  backdrop-filter:blur(20px);
  padding:0 12px;padding-top:var(--safe-t);
  box-shadow:0 4px 20px rgba(0,0,0,.6);
}
.hdr-in{
  max-width:680px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;height:44px;
}
.hdr-title{
  font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.25em;
  color:var(--accent);text-shadow:0 0 10px var(--accent-glow);
}

.wrap{
  max-width:680px;margin:0 auto;
  padding:10px;padding-bottom:var(--safe-b);
  display:flex;flex-direction:column;gap:10px;
}

.section-block{
  display:flex;flex-direction:column;gap:8px;
  background:rgba(11,17,36,0.85);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:10px;
  backdrop-filter:blur(12px);
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}

.menu-pills-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
}
.menu-pill{
  width:100%;padding:7px 8px;border-radius:var(--r-xs);
  background:var(--surface2);border:1px solid var(--border2);color:var(--text2);
  font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:all .2s ease;cursor:pointer;text-align:center;
}
.menu-pill.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 0 10px var(--accent-glow);
}

.collapsible-pane{
  display:none;flex-direction:column;gap:6px;margin-top:2px;
}
.collapsible-pane.show{display:flex;}

.km-hero-compact{
  display:flex;align-items:center;justify-content:space-between;
  border-radius:var(--r-sm);
  border:1px solid rgba(59,130,246,.35);
  background:linear-gradient(145deg,#111936 0%,#070913 100%);
  padding:8px 12px;
}
.km-value-compact{
  font-size:20px;font-weight:900;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff 20%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.km-meta-compact{
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;
}

.gps{
  display:flex;align-items:center;justify-content:center;gap:4px;
  min-height:28px;border-radius:var(--r-xs);
  border:1px solid;padding:0 8px;
  font-size:8px;font-weight:800;letter-spacing:.08em;
  text-align:center;text-transform:uppercase;
}
.gps.bad{border-color:rgba(100,116,139,.3);background:rgba(11,17,36,.9);color:#e5e7eb}
.gps.ok{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1);color:#d1fae5}
.gps.warn{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.1);color:#fef3c7}

.card{
  border-radius:var(--r-sm);
  border:1px solid var(--border);
  background:rgba(11,17,36,0.9);
  padding:8px;
}
.card-accent{
  border-color:rgba(59,130,246,.35);
  background:linear-gradient(145deg,rgba(59,130,246,.05),rgba(11,17,36,.9));
}

.search-row{display:flex;gap:4px}
.search-wrap{flex:1;min-width:0;position:relative}
.search-input{
  width:100%;border-radius:var(--r-xs);
  border:1px solid var(--border2);
  background:rgba(7,9,19,.9);
  padding:7px 8px;
  font-size:10px;font-weight:800;text-transform:uppercase;color:#fff;
  transition:all .2s ease;
}
.search-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 10px var(--accent-glow);
}
.btn-icon{
  width:32px;height:32px;border-radius:var(--r-xs);
  display:grid;place-items:center;flex-shrink:0;
  border:1px solid var(--border);
}
.btn-icon.go{background:linear-gradient(135deg,var(--accent),#1d4ed8);color:#fff;font-weight:900;border:none;box-shadow:0 0 8px var(--accent-glow)}
.btn-icon.clr{background:rgba(7,9,19,.9);color:var(--muted)}
.btn-icon svg{width:12px;height:12px}
.search-msg{
  margin-top:4px;font-size:8px;font-weight:800;
  text-transform:uppercase;color:var(--warn);
}

.modal-box{
  background:rgba(11,17,36,0.95);
  border:1px solid var(--border2);
  border-radius:var(--r-sm);
  padding:8px;
  margin-top:6px;
  display:flex;flex-direction:column;gap:4px;
}
.modal-box p{font-size:8px;font-weight:800;color:var(--accent);text-transform:uppercase;}
.modal-btns{display:flex;gap:4px}
.modal-btn{
  flex:1;padding:6px;border-radius:var(--r-xs);font-size:8px;font-weight:900;text-transform:uppercase;
  background:var(--accent);color:#fff;cursor:pointer;text-align:center;
}
.modal-btn.rj{background:#2563eb;color:#fff;}

.coord-container{
  display:flex;flex-direction:column;gap:6px;
}
.coord-inputs{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.coord-input{
  width:100%;border-radius:var(--r-xs);border:1px solid var(--border2);
  background:rgba(7,9,19,.9);padding:6px;font-size:10px;font-weight:800;color:#fff;text-align:center;
}

.map-box{
  border-radius:var(--r-xs);border:1px solid var(--border2);
  overflow:hidden;position:relative;height:220px;background:#020617;
  margin-top:4px;
}

body.fs-active .hdr,
body.fs-active .wrap > .section-block:not(:has(#mapBox)),
body.fs-active .wrap > .section-block:has(#kmVal) {
  display: none !important;
}

.map-box.fullscreen{
  position:fixed !important;inset:0 !important;width:100vw !important;
  height:100vh !important;height:100dvh !important;z-index:999999 !important;
  border-radius:0 !important;border:none !important;margin:0 !important;
}

.map-ctrls{
  position:absolute;top:4px;right:4px;z-index:1000;
  display:flex;gap:3px;background:rgba(7,9,19,.9);padding:2px;border-radius:4px;border:1px solid var(--border2);
}
.map-btn{
  font-size:7px;font-weight:900;text-transform:uppercase;padding:2px 5px;
  border-radius:2px;background:rgba(255,255,255,.05);color:var(--text2);cursor:pointer;
}
.map-btn.active{background:var(--accent);color:#fff}

.fs-close-btn{
  display:none;position:fixed;top:12px;left:12px;z-index:1000000;
  background:rgba(239,68,68,.9);color:#fff;padding:6px 12px;
  border-radius:var(--r-xs);font-size:9px;font-weight:900;text-transform:uppercase;
  box-shadow:0 4px 12px rgba(0,0,0,.5);cursor:pointer;border:1px solid rgba(255,255,255,.3);
}
.map-box.fullscreen ~ .fs-close-btn{display:inline-flex;align-items:center;gap:4px;}

.post{
  border-radius:var(--r-sm);overflow:hidden;
  border:1px solid var(--border);
  background:rgba(11,17,36,0.95);
  transition:all .2s ease;
}
.post.near{
  border-color:rgba(16,185,129,.5);
  background:linear-gradient(145deg,rgba(16,185,129,.1),rgba(11,17,36,.95));
  box-shadow:0 0 12px rgba(16,185,129,.15);
}
.post.searched{
  border-color:rgba(59,130,246,.5);
  background:linear-gradient(145deg,rgba(59,130,246,.1),rgba(11,17,36,.95));
  box-shadow:0 0 12px var(--accent-glow);
}
.post-top{display:flex;align-items:flex-start;gap:6px;padding:8px}
.post-chk{margin-top:2px;width:13px;height:13px;accent-color:var(--accent);flex-shrink:0}
.post-id{font-size:9px;font-weight:900;text-transform:uppercase;color:var(--accent);letter-spacing:.05em}
.post-dist{font-size:6.5px;font-weight:600;text-transform:lowercase;color:var(--muted);margin-top:1px}
.post-coords{font-size:7px;color:var(--dim);font-weight:600}

.post-wa{
  width:26px;height:26px;border-radius:var(--r-xs);
  background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);
  color:var(--green2);display:grid;place-items:center;flex-shrink:0;
}
.post-wa svg{width:12px;height:12px}

.post-map{height:100px;width:100%;border:0;filter:grayscale(15%) contrast(1.05)}

.ctrl-send{
  width:auto;min-width:120px;padding:5px 10px;border-radius:var(--r-xs);
  background:linear-gradient(135deg,var(--green),#059669);color:#fff;font-size:8px;font-weight:900;
  text-transform:uppercase;letter-spacing:.08em;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 2px 6px rgba(16,185,129,.2);
}
.ctrl-send:disabled{background:var(--dim);color:var(--muted);box-shadow:none}
.ctrl-send svg{width:11px;height:11px}

.ctrl-row{
  display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px;
}
.ctrl-label{
  font-size:8px;font-weight:800;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:3px;
}
.ctrl-select{
  border-radius:4px;border:1px solid var(--border2);background:var(--bg);color:#fff;
  padding:2px 14px 2px 4px;font-size:9px;font-weight:800;appearance:none;
}
.ctrl-chk{width:13px;height:13px;accent-color:var(--accent)}

.leaflet-popup-content-wrapper{
  background:rgba(11,17,36,0.96) !important;
  color:#fff !important;
  border:1px solid var(--border2) !important;
  border-radius:var(--r-xs) !important;
  box-shadow:0 4px 16px rgba(0,0,0,.6) !important;
  backdrop-filter:blur(8px);
}
.leaflet-popup-tip{background:rgba(11,17,36,0.96) !important;}

.toast{
  position:fixed;bottom:calc(10px + var(--safe-b));left:50%;
  transform:translateX(-50%) translateY(10px);
  border-radius:var(--r-xs);border:1px solid var(--border2);
  background:var(--surface);padding:6px 12px;font-size:8px;font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;z-index:99999;opacity:0;transition:all .15s ease;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{color:var(--accent);border-color:rgba(59,130,246,.4);box-shadow:0 0 10px var(--accent-glow)}
.toast.err{color:#fecaca;border-color:rgba(239,68,68,.4)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="hdr-title">Apoio Técnico</div>
    <div style="font-size:9px;font-weight:900;color:var(--accent);" id="topKmLive">—</div>
  </div>
</header>

<div class="wrap">

  <div class="section-block">
    <div class="menu-pills-grid">
      <button class="menu-pill" id="pillId" onclick="switchPane('id')">🔍 Pesquisa por ID</button>
      <button class="menu-pill" id="pillKm" onclick="switchPane('km')">🛣️ Pesquisa por KM</button>
      <button class="menu-pill" id="pillCoord" onclick="switchPane('coord')">📍 Coordenada</button>
      <button class="menu-pill" id="pillMap" onclick="switchPane('map')">🗺️ Pesquisa no Mapa</button>
    </div>

    <!-- PAINEL: ID -->
    <div class="collapsible-pane" id="paneId">
      <div class="card card-accent">
        <div class="search-row">
          <div class="search-wrap">
            <input class="search-input" id="inputId" placeholder="ID (8 DÍGITOS)" inputmode="numeric" pattern="[0-9]*" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')searchId()">
          </div>
          <button class="btn-icon go" onclick="searchId()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
          <button class="btn-icon clr" onclick="clearId()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div id="searchMsg" class="search-msg" style="display:none"></div>
        <div id="searchResult" style="display:none;margin-top:6px"></div>
      </div>
    </div>

    <!-- PAINEL: KM -->
    <div class="collapsible-pane" id="paneKm">
      <div class="card card-accent">
        <div class="search-row">
          <div class="search-wrap">
            <input class="search-input" id="inputKm" placeholder="KM (EX: 115)" inputmode="decimal" pattern="[0-9]*" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')searchKm()">
          </div>
          <button class="btn-icon go" onclick="searchKm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></button>
          <button class="btn-icon clr" onclick="clearKm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div id="searchKmMsg" class="search-msg" style="display:none"></div>
        <div id="searchKmModal" style="display:none"></div>
        <div id="searchKmResult" style="display:none;margin-top:6px"></div>
      </div>
    </div>

    <!-- PAINEL: COORDENADA -->
    <div class="collapsible-pane" id="paneCoord">
      <div class="card card-accent">
        <div style="font-size:8px;font-weight:900;text-transform:uppercase;color:var(--accent);margin-bottom:4px;">Coordenada Manual</div>
        <div class="coord-container">
          <div class="coord-inputs">
            <input class="coord-input" id="inputLat" placeholder="LAT" inputmode="decimal" pattern="[0-9]*" autocomplete="off" spellcheck="false">
            <input class="coord-input" id="inputLon" placeholder="LON" inputmode="decimal" pattern="[0-9]*" autocomplete="off" spellcheck="false">
          </div>
          <div style="display:flex;gap:3px;">
            <button class="btn-icon go" style="flex:1;height:28px;border-radius:var(--r-xs);font-size:8px;" onclick="searchManualCoord()">Calcular</button>
            <button class="btn-icon clr" onclick="clearCoordFields()" style="width:28px;height:28px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>
        </div>
        <div id="searchCoordResult" style="display:none;margin-top:6px"></div>
      </div>
    </div>

    <!-- PAINEL: MAPA -->
    <div class="collapsible-pane" id="paneMap">
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;">
          <span style="font-size:8px;font-weight:900;text-transform:uppercase;color:var(--accent)">Mapa Interativo</span>
          <button class="ctrl-select" style="padding:2px 6px;font-size:7px;cursor:pointer;" onclick="useCurrentGps()">GPS Atual</button>
        </div>
        <div class="map-box" id="mapBox">
          <div class="map-ctrls">
            <button class="map-btn active" id="btnLayerSat" onclick="setMapLayer('sat')">Sat</button>
            <button class="map-btn" id="btnLayerNorm" onclick="setMapLayer('norm')">Norm</button>
            <button class="map-btn" onclick="toggleFullscreen()">Full</button>
          </div>
          <div id="leafletMap" style="width:100%;height:100%;"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="fs-close-btn" onclick="toggleFullscreen()">✕ Fechar Tela Cheia</button>

  <div class="section-block">
    <div class="km-hero-compact">
      <div>
        <div class="km-value-compact" id="kmVal">—</div>
      </div>
      <div class="km-meta-compact">
        <span class="km-br-badge" id="kmBrBadge">SINTONIZANDO...</span>
        <div id="cityNameDisplay" style="font-size:8px;font-weight:800;color:var(--text2);text-transform:uppercase;">---</div>
      </div>
    </div>

    <div id="gpsStatus" class="gps bad">GPS · BUSCANDO SINAL</div>

    <div class="card">
      <div class="ctrl-row" style="margin-top:0;">
        <div style="display:flex;align-items:center;gap:4px;">
          <label class="ctrl-label">Qtd:</label>
          <select class="ctrl-select" id="qty">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <label class="ctrl-label" style="margin-left:4px;">
            <input type="checkbox" class="ctrl-chk" id="chkMaps" checked> Maps
          </label>
        </div>
        <button id="btnSend" class="ctrl-send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          Enviar WhatsApp
        </button>
      </div>
    </div>

    <div id="postList" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>

</div>

<div class="toast" id="toast" aria-live="polite"></div>

<!-- Leaflet JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
const norm=s=>String(s||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9_ ]+/g,' ').replace(/\s+/g,' ');
const parsePt=v=>{const s=String(v??'').trim();return/,\d+$/.test(s)?Number(s.replace(/\./g,'').replace(',','.')):Number(s)};
const hav=(a,b,c,d)=>{const p=Math.PI/180,x=.5-Math.cos((c-a)*p)/2+Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;return 12742000*Math.asin(Math.sqrt(x))};

const formatDist = dist => {
  const m = Math.max(0, Math.round(dist));
  if (m < 1000) {
    return `${m}m`;
  }
  const km = m / 1000;
  return `${km.toFixed(1).replace('.', ',')} km`;
};

const nowBR=()=>new Date().toLocaleString('pt-BR').toUpperCase();
function findCol(h,cs){const m=h.map(norm);for(const c of cs){const i=m.indexOf(norm(c));if(i>=0)return i}return-1}

let posts=[], postIndex=new Map();
let kmDB_SP=[], kmDB_RJ=[];
let pos=null, searchItem=null, searchKmItems=[], searchCoordItems=[], renderedKey='';
let mapInstance=null, mapMarker=null, mapLayerObj=null, popupInstance=null;
let activePane = null;
let cityCache = new Map();

function showToast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.className='toast '+type;el.textContent=msg;
  requestAnimationFrame(()=>{el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500)});
}

function switchPane(type){
  ['Id','Km','Coord','Map'].forEach(p=>{
    let pane = document.getElementById('pane'+p);
    let pill = document.getElementById('pill'+p);
    if(p.toLowerCase() === type){
      let isOpen = pane.classList.toggle('show');
      pill.classList.toggle('active', isOpen);
      activePane = isOpen ? type : null;
      if(isOpen && type==='map' && mapInstance) setTimeout(()=>mapInstance.invalidateSize(), 50);
    } else {
      pane.classList.remove('show');
      pill.classList.remove('active');
    }
  });
}

function gpsBadge(el,p,err){
  const a=p?.acc;let cls='bad',txt;
  if(err)txt=err;
  else if(!a)txt='GPS · BUSCANDO';
  else if(a<=15) {cls='ok';txt=`GPS · ALTA (±${Math.round(a)}M)`;}
  else {cls='warn';txt=`GPS · MÉDIA (±${Math.round(a)}M)`;}
  el.className='gps '+cls;el.textContent=txt;
}

async function fetchCityName(lat, lon){
  const key = `${lat.toFixed(2)},${lon.toFixed(2)}`;
  if(cityCache.has(key)) return cityCache.get(key);
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`, {headers:{'Accept-Language':'pt-BR'}});
    if(r.ok){
      const data = await r.json();
      const addr = data.address || {};
      const city = addr.city || addr.town || addr.municipality || addr.village || addr.county || 'Localização Desconhecida';
      const state = addr.state ? `, ${addr.state}` : '';
      const result = `${city}${state}`.toUpperCase();
      cityCache.set(key, result);
      return result;
    }
  }catch(e){}
  return '---';
}

async function fetchCSV(files){
  for(const f of files){
    try{
      let r=await fetch(f+'?v='+Date.now(),{cache:'force-cache'});
      if(r?.ok){let t=await r.text();if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);return t;}
    }catch(e){}
  }
  return null;
}

async function loadSystemData(){
  try{

    if(t){

      let h=lines.shift().split(';');
      let iId=findCol(h,['id do nox','idnox','id']),iLat=findCol(h,['latitude','lat']),iLon=findCol(h,['longitude','lon','long']);
      posts=lines.map(l=>{
        let r=l.split(';');
        return {id:String(r[iId]||'').trim().toUpperCase(), lat:parsePt(r[iLat]), lon:parsePt(r[iLon])};
      }).filter(p=>p.id&&Number.isFinite(p.lat)&&Number.isFinite(p.lon));

      postIndex.clear();
      posts.forEach(p=>postIndex.set(p.id, p));
    }

    let [tSP, tRJ] = await Promise.all([

    ]);

    kmDB_RJ = await parseKmFile(tRJ);

async function parseKmFile(text){
  if(!text)return [];
  let lines=text.split(/\r?\n/).filter(l=>l.trim());
  let h=lines.shift().split(';');
  let iKm=findCol(h,['km']),iLat=findCol(h,['lat','latitude']),iLon=findCol(h,['lon','long','longitude']);
  return lines.map(l=>{
    let r=l.split(';');
    return {km:parsePt(r[iKm]),lat:parsePt(r[iLat]),lon:parsePt(r[iLon])};
  }).filter(p=>Number.isFinite(p.km)&&Number.isFinite(p.lat)&&Number.isFinite(p.lon));
}

function findNearestInAnyDB(lat, lon){
  let candidates=[
    {name:'BR116/SP', db:kmDB_SP},
    {name:'BR116/RJ', db:kmDB_RJ}
  ].map(c=>{
    let best=null, bd=Infinity;
    for(let p of c.db){
      if(Math.abs(p.lat - lat) > 0.4 || Math.abs(p.lon - lon) > 0.4) continue;
      let d=hav(lat, lon, p.lat, p.lon);
      if(d<bd){bd=d;best={...p,d};}
    }
    return {name:c.name, res:best};
  }).filter(c=>c.res!==null);

  if(!candidates.length)return null;
  candidates.sort((a,b)=>a.res.d - b.res.d);
  return candidates[0];
}

async function updateKm(){
  if(!pos)return;
  let best=findNearestInAnyDB(pos.lat, pos.lon);
  if(!best)return;
  let kmValStr=(Math.round(best.res.km*100)/100).toFixed(2).replace('.',',');
  let fullStr = `KM ${kmValStr}`;
  document.getElementById('kmVal').textContent = fullStr;
  document.getElementById('topKmLive').textContent = fullStr;
  document.getElementById('kmBrBadge').textContent = best.name;
}

function findPostExactKm(post){
  let dbs=[{name:'SP', db:kmDB_SP},{name:'RJ', db:kmDB_RJ}];
  for(let dbObj of dbs){
    if(dbObj.db.length){
      let best=null, bd=Infinity;
      for(let pt of dbObj.db){
        if(Math.abs(pt.lat - post.lat) > 0.3 || Math.abs(pt.lon - post.lon) > 0.3) continue;
        let d=hav(post.lat, post.lon, pt.lat, pt.lon);
        if(d<bd){bd=d;best=pt;}
      }
      if(best && bd < 3000){
        return (Math.round(best.km*1000)/1000).toFixed(3).replace('.',',') + ' ('+dbObj.name+')';
      }
    }
  }
  return '---';
}

    const cityName = await fetchCityName(l.lat, l.lng);
    const nearestKm = findNearestInAnyDB(l.lat, l.lng);

      kmStr = `KM ${(Math.round(nearestKm.res.km*100)/100).toFixed(2).replace('.','mö')} (${nearestKm.name})`.replace('mö',',');

function getDbRange(db){
  if(!db || !db.length) return {min: Infinity, max: -Infinity};
  let min = Infinity, max = -Infinity;
  for(let pt of db){
    if(pt.km < min) min = pt.km;
    if(pt.km > max) max = pt.km;
  }
  return {min, max};
}

function executeSearchKm(db, label){
  let rawVal=document.getElementById('inputKm').value;
  let targetKm=parsePt(rawVal);
  let msg=document.getElementById('searchKmMsg'),res=document.getElementById('searchKmResult');
  let modal=document.getElementById('searchKmModal');
  modal.style.display='none';

  let rangeInfo = getDbRange(db);
  if(targetKm < (rangeInfo.min - 3) || targetKm > (rangeInfo.max + 3)){
    msg.style.display='flex';
    msg.textContent='pesquisa fora do range de localização';
    searchKmItems=[];res.style.display='none';return;
  }

  let bestPt=null, minDiff=Infinity;
  for(let pt of db){
    let diff=Math.abs(pt.km - targetKm);
    if(diff<minDiff){minDiff=diff;bestPt=pt;}
  }

  if(!bestPt || minDiff > 5.0){
    msg.style.display='flex';
    msg.textContent='pesquisa fora do range de localização';
    searchKmItems=[];res.style.display='none';return;
  }

  let sorted = posts.map(p=>({
    ...p, d: (Math.abs(p.lat - bestPt.lat) > 0.2 || Math.abs(p.lon - bestPt.lon) > 0.2) ? 999999 : hav(bestPt.lat, bestPt.lon, p.lat, p.lon)
  })).sort((a,b)=>a.d - b.d).slice(0, 10);

  searchKmItems=sorted;
  msg.style.display='none';
  renderSearchKm(label, bestPt);
  showToast('Resultados carregados');
}

function searchKm(){

  let targetKm=parsePt(rawVal);
  let msg=document.getElementById('searchKmMsg'),res=document.getElementById('searchKmResult'),modal=document.getElementById('searchKmModal');
  
  if(isNaN(targetKm)){clearKm();return;}
  if(!posts.length||(!kmDB_SP.length&&!kmDB_RJ.length)){
    msg.style.display='flex';msg.textContent='Aguardando bases';return;
  }

  let rangeSP = getDbRange(kmDB_SP);
  let rangeRJ = getDbRange(kmDB_RJ);

  let inSP = (targetKm >= rangeSP.min - 3 && targetKm <= rangeSP.max + 3);
  let inRJ = (targetKm >= rangeRJ.min - 3 && targetKm <= rangeRJ.max + 3);

  if(!inSP && !inRJ){
    msg.style.display='flex';
    msg.textContent='pesquisa fora do range de localização';
    res.style.display='none';
    modal.style.display='none';
    searchKmItems=[];
    return;

  if(inSP && inRJ){
    msg.style.display='none';
    res.style.display='none';
    modal.style.display='block';
    modal.innerHTML=`<div class="modal-box">
      <p>KM ${rawVal} em SP e RJ. Escolha a base:</p>
      <div class="modal-btns">
        <button class="modal-btn" onclick="executeSearchKm(kmDB_SP, 'BR116-SP')">São Paulo</button>
        <button class="modal-btn rj" onclick="executeSearchKm(kmDB_RJ, 'BR116-RJ')">Rio de Janeiro</button>
      </div>
    </div>`;
    return;
  }

  modal.style.display='none';
  if(inSP){
    executeSearchKm(kmDB_SP, 'BR116-SP');
  }else{
    executeSearchKm(kmDB_RJ, 'BR116-RJ');
  }
}

      </div>
      <button class="post-wa" onclick="sendWhatsApp('${o.id}', ${o.lat}, ${o.lon})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </button>
    </div>
    <div style="padding:0 6px 6px;"><iframe class="post-map" src="https://maps.google.com/maps?q=${o.lat},${o.lon}&t=k&z=19&output=embed" loading="lazy"></iframe></div>`;
    frag.appendChild(div);
  }

  list.innerHTML='';
  list.appendChild(frag);
  document.getElementById('btnSend').disabled=false;
}

document.getElementById('btnSend').onclick=()=>{
  if(!pos)return;
  let chks=document.querySelectorAll('.post-chk:checked');
  let items=[];
  if(chks.length){
    chks.forEach(c=>items.push({id:c.value,lat:parseFloat(c.dataset.lat),lon:parseFloat(c.dataset.lon)}));
  }else{
    let qty=Number(document.getElementById('qty').value||10);
    items=posts.map(p=>({...p,d:hav(pos.lat,pos.lon,p.lat,p.lon)})).sort((a,b)=>a.d-b.d).slice(0,qty);
  }
  let tx=`📍 *LISTA*\nData: ${nowBR()}\n\n`;
  items.forEach((o,i)=>{
    tx+=`${i+1}. ID: ${o.id} (KM: ${findPostExactKm(o)})\n`;
    if(document.getElementById('chkMaps').checked) tx+=`   https://maps.google.com/?q=${o.lat.toFixed(5)},${o.lon.toFixed(5)}\n`;
  });
  window.open('https://wa.me/?text='+encodeURIComponent(tx),'_blank','noopener');
  showToast('Enviado');
};

document.getElementById('qty').onchange=()=>{renderedKey='';renderApoio()};

window.addEventListener('DOMContentLoaded', loadSystemData);
</script>
</body>
</html>
