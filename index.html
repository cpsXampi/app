<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#030712">
<title>Portal de Mídia & Stream Aberto</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<style>
:root{
  --bg:#030712;
  --surface:#0f172a;
  --surface2:#1e293b;
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.15);
  --accent:#3b82f6;
  --accent-hover:#2563eb;
  --green:#10b981;
  --text:#f8fafc;
  --text-muted:#94a3b8;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(circle at top,rgba(59,130,246,.12),transparent 50%),var(--bg);
  color:var(--text);font-family:var(--font);min-height:100vh;display:flex;flex-direction:column;
  overflow-x:hidden;
}
header{
  height:60px;background:rgba(15,23,42,0.85);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;position:sticky;top:0;z-index:100;
}
.brand{font-weight:900;font-size:13px;letter-spacing:0.15em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.brand span{background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;font-size:9px;}

.container{max-width:900px;margin:0 auto;width:100%;padding:20px;flex:1;display:flex;flex-direction:column;gap:20px;padding-bottom:120px;}

.search-box{display:flex;gap:8px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-md);padding:8px;}
.search-input{flex:1;background:transparent;border:0;color:var(--text);font-size:13px;padding:4px 8px;outline:none;}
.search-input::placeholder{color:var(--text-muted);}
.btn{background:var(--accent);color:#fff;border:0;padding:8px 16px;border-radius:var(--r-sm);font-weight:800;font-size:11px;cursor:pointer;text-transform:uppercase;transition:background 0.15s;}
.btn:hover{background:var(--accent-hover);}

.tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);padding-bottom:10px;}
.tab{background:var(--surface);color:var(--text-muted);border:1px solid var(--border);padding:6px 14px;border-radius:var(--r-sm);font-size:11px;font-weight:800;cursor:pointer;text-transform:uppercase;}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.media-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color 0.15s;}
.media-card:hover{border-color:var(--border2);}
.media-title{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.media-subtitle{font-size:10px;color:var(--text-muted);text-transform:uppercase;}

/* PLAYER FIXO INFERIOR */
.player-bar{
  position:fixed;bottom:0;left:0;right:0;height:80px;
  background:rgba(15,23,42,0.95);backdrop-filter:blur(20px);
  border-top:1px solid var(--border2);display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;z-index:200;
}
.player-info{display:flex;align-items:center;gap:12px;min-width:0;}
.player-thumb{width:48px;height:48px;background:var(--surface2);border-radius:var(--r-sm);display:grid;place-items:center;font-size:16px;}
.player-details h4{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-details p{font-size:9px;color:var(--text-muted);}

.player-controls{display:flex;align-items:center;gap:12px;}
.control-btn{background:var(--surface2);color:#fff;border:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:12px;}
.control-btn.play{background:var(--green);}
</style>
</head>
<body>

<header>
  <div class="brand">
    OpenStream <span>PRO</span>
  </div>
  <div style="font-size:10px;color:var(--text-muted);font-weight:800;text-transform:uppercase;">Zero Ads | Stream ao Vivo</div>
</header>

<div class="container">
  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar músicas, áudios ou vídeos abertos..." onkeydown="if(event.key==='Enter')performSearch()">
    <button class="btn" onclick="performSearch()">Buscar</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('music')">Músicas & Áudios</button>
    <button class="tab" onclick="switchTab('video')">Vídeos & Streams</button>
  </div>

  <div id="mediaContainer" class="media-grid">
    <!-- Os cards de mídia serão injetados aqui dinamicamente -->
  </div>
</div>

<!-- BARRA DE REPRODUÇÃO FIXA -->
<div class="player-bar">
  <div class="player-info">
    <div class="player-thumb">🎵</div>
    <div class="player-details">
      <h4 id="nowPlayingTitle">Nenhuma faixa selecionada</h4>
      <p id="nowPlayingArtist">Selecione um item para iniciar</p>
    </div>
  </div>
  <div class="player-controls">
    <button class="control-btn" onclick="prevTrack()">⏮</button>
    <button class="control-btn play" id="playPauseBtn" onclick="togglePlay()">▶</button>
    <button class="control-btn" onclick="nextTrack()">⏭</button>
  </div>
</div>

<audio id="audioElement" onended="nextTrack()"></audio>

<script>
// Base de dados simulada de repositórios de mídia abertos / domínio público
const mediaDatabase = {
  music: [
    { title: "Lofi Study Session [Open Stream]", artist: "Free Repository Audio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
    { title: "Ambient Cyber Space", artist: "Open Source Audio GitHub", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
    { title: "Synthwave Sunset Run", artist: "Community Stream", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
    { title: "Classical Piano Sonata", artist: "Public Domain Archive", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
  ],
  video: [
    { title: "Big Buck Bunny (Open Movie 4K)", artist: "Blender Foundation", url: "https://www.w3schools.com/html/mov_bbb.mp4" },
    { title: "Nature Wildlife Stream", artist: "Public Domain Media", url: "https://www.w3schools.com/html/mov_bbb.mp4" }
  ]
};

let currentTab = 'music';
let currentTrackIndex = 0;
let isPlaying = false;

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.currentTarget.classList.add('active');
  renderMediaList(mediaDatabase[tab]);
}

function renderMediaList(items){
  const container = document.getElementById('mediaContainer');
  container.innerHTML = '';
  items.forEach((item, index)=>{
    const card = document.createElement('div');
    card.className = 'media-card';
    card.innerHTML = `
      <div class="media-title">${item.title}</div>
      <div class="media-subtitle">${item.artist}</div>
      <button class="btn" style="margin-top:auto;" onclick="playMedia('${currentTab}', ${index})">Reproduzir</button>
    `;
    container.appendChild(card);
  });
}

function playMedia(type, index){
  currentTrackIndex = index;
  const item = mediaDatabase[type][index];
  const audio = document.getElementById('audioElement');
  
  document.getElementById('nowPlayingTitle').textContent = item.title;
  document.getElementById('nowPlayingArtist').textContent = item.artist;
  
  audio.src = item.url;
  audio.play();
  isPlaying = true;
  document.getElementById('playPauseBtn').textContent = '⏸';
}

function togglePlay(){
  const audio = document.getElementById('audioElement');
  if(!audio.src) return;
  if(isPlaying){
    audio.pause();
    isPlaying = false;
    document.getElementById('playPauseBtn').textContent = '▶';
  } else {
    audio.play();
    isPlaying = true;
    document.getElementById('playPauseBtn').textContent = '⏸';
  }
}

function nextTrack(){
  const list = mediaDatabase[currentTab];
  currentTrackIndex = (currentTrackIndex + 1) % list.length;
  playMedia(currentTab, currentTrackIndex);
}

function prevTrack(){
  const list = mediaDatabase[currentTab];
  currentTrackIndex = (currentTrackIndex - 1 + list.length) % list.length;
  playMedia(currentTab, currentTrackIndex);
}

function performSearch(){
  const query = document.getElementById('searchInput').value.toLowerCase();
  const list = mediaDatabase[currentTab].filter(item => item.title.toLowerCase().includes(query) || item.artist.toLowerCase().includes(query));
  renderMediaList(list);
}

// Inicializar carregando as músicas
window.addEventListener('DOMContentLoaded', ()=>{
  renderMediaList(mediaDatabase.music);
});
</script>
</body>
</html>
