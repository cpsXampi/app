<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070913">
<title>Apoio Técnico</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root{
  --bg:#070913;
  --surface:#0d1226;
  --surface2:#131b38;
  --border:rgba(212,175,55,.15);
  --border2:rgba(212,175,55,.3);
  --accent:#d4af37;
  --accent-glow:rgba(212,175,55,.25);
  --green:#10b981;
  --green2:#34d399;
  --violet:#5b21ff;
  --violet2:#7c3aed;
  --red:#ef4444;
  --warn:#f59e0b;
  --text:#f3f4f6;
  --text2:#d1d5db;
  --muted:#9ca3af;
  --dim:#4b5563;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-xs:6px;--r-sm:10px;--r-md:14px;--r-lg:18px;
  --safe-b:max(env(safe-area-inset-bottom,0px),16px);
  --safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:radial-gradient(circle at top,rgba(212,175,55,.07),transparent 60%),var(--bg);
  color:var(--text);
  font-family:var(--font);
  overflow-x:hidden;
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{
  font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
button:active{opacity:.8;transform:scale(.97)}
input,select{font-family:var(--font);outline:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:9px}

.hdr{
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid var(--border2);
  background:rgba(7,9,19,.92);
  backdrop-filter:blur(20px);
  padding:0 14px;padding-top:var(--safe-t);
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.hdr-in{
  max-width:680px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;height:50px;
}
.hdr-title{
  font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;
  color:var(--accent);
  text-shadow:0 0 12px var(--accent-glow);
}
.hdr-freq{
  font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  color:var(--green2);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);
  padding:2px 6px;border-radius:4px;
}

.wrap{
  max-width:680px;margin:0 auto;
  padding:12px;padding-bottom:var(--safe-b);
  display:flex;flex-direction:column;gap:12px;
}

.section-block{
  display:flex;flex-direction:column;gap:10px;
  background:rgba(13,18,38,0.75);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:12px;
  backdrop-filter:blur(12px);
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}

.km-hero{
  border-radius:var(--r-sm);
  border:1px solid rgba(212,175,55,.3);
  background:linear-gradient(145deg,#131936 0%,#070913 100%);
  text-align:center;
  padding:14px;
  position:relative;overflow:hidden;
  box-shadow:inset 0 0 20px rgba(212,175,55,.05);
}
.km-value{
  font-size:clamp(28px,8vw,38px);font-weight:900;
  line-height:1.1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff 20%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 20px var(--accent-glow);
}
.km-br-badge{
  display:inline-block;
  font-size:8px;font-weight:700;
  color:rgba(212,175,55,.7);
  text-transform:uppercase;
  background:rgba(212,175,55,.1);
  border:1px solid rgba(212,175,55,.2);
  padding:2px 8px;
  border-radius:4px;
  margin-top:4px;
  letter-spacing:.1em;
}

.gps{
  display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:36px;border-radius:var(--r-xs);
  border:1px solid;padding:0 10px;
  font-size:9px;font-weight:800;letter-spacing:.08em;
  text-align:center;text-transform:uppercase;
}
.gps.bad{border-color:rgba(148,163,184,.3);background:rgba(15,23,42,.9);color:#e5e7eb}
.gps.ok{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1);color:#d1fae5}
.gps.warn{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.1);color:#fef3c7}

.card{
  border-radius:var(--r-sm);
  border:1px solid var(--border);
  background:rgba(13,18,38,0.9);
  padding:10px;
}
.card-accent{
  border-color:rgba(212,175,55,.3);
  background:linear-gradient(145deg,rgba(212,175,55,.04),rgba(13,18,38,.9));
}

.search-row{display:flex;gap:6px}
.search-wrap{flex:1;min-width:0;position:relative}
.search-input{
  width:100%;border-radius:var(--r-xs);
  border:1px solid var(--border2);
  background:rgba(7,9,19,.9);
  padding:9px 10px;
  font-size:11px;font-weight:800;text-transform:uppercase;color:#fff;
  transition:all .2s ease;
}
.search-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 10px var(--accent-glow);
}
.btn-icon{
  width:36px;height:36px;border-radius:var(--r-xs);
  display:grid;place-items:center;flex-shrink:0;
  border:1px solid var(--border);
}
.btn-icon.go{background:linear-gradient(135deg,var(--accent),#b38f27);color:#070913;font-weight:900;border:none;box-shadow:0 0 10px var(--accent-glow)}
.btn-icon.clr{background:rgba(7,9,19,.9);color:var(--muted)}
.btn-icon svg{width:14px;height:14px}
.search-msg{
  margin-top:6px;font-size:9px;font-weight:800;
  text-transform:uppercase;color:var(--warn);
}

.coord-container{
  margin-top:8px;padding-top:8px;
  border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:8px;
}
.coord-inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.coord-input{
  width:100%;border-radius:var(--r-xs);border:1px solid var(--border2);
  background:rgba(7,9,19,.9);padding:8px;font-size:11px;font-weight:800;color:#fff;text-align:center;
}
.coord-btn-toggle{
  background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);
  color:var(--accent);font-size:8px;font-weight:900;padding:3px 8px;border-radius:4px;
  text-transform:uppercase;cursor:pointer;letter-spacing:.08em;
}

.map-box{
  border-radius:var(--r-xs);border:1px solid var(--border2);
  overflow:hidden;position:relative;height:260px;background:#020617;
}
.map-box.fullscreen{
  position:fixed !important;inset:0 !important;width:100vw !important;
  height:100vh !important;height:100dvh !important;z-index:999999 !important;
  border-radius:0 !important;border:none !important;
}
.map-ctrls{
  position:absolute;top:6px;right:6px;z-index:1000;
  display:flex;gap:4px;background:rgba(7,9,19,.9);padding:2px;border-radius:4px;border:1px solid var(--border2);
}
.map-btn{
  font-size:8px;font-weight:900;text-transform:uppercase;padding:3px 6px;
  border-radius:3px;background:rgba(255,255,255,.05);color:var(--text2);cursor:pointer;
}
.map-btn.active{background:var(--accent);color:#070913}

.post{
  border-radius:var(--r-sm);overflow:hidden;
  border:1px solid var(--border);
  background:rgba(13,18,38,0.95);
  transition:all .2s ease;
}
.post.near{
  border-color:rgba(16,185,129,.5);
  background:linear-gradient(145deg,rgba(16,185,129,.1),rgba(13,18,38,.95));
  box-shadow:0 0 15px rgba(16,185,129,.15);
}
.post.searched{
  border-color:rgba(212,175,55,.5);
  background:linear-gradient(145deg,rgba(212,175,55,.1),rgba(13,18,38,.95));
  box-shadow:0 0 15px var(--accent-glow);
}
.post-top{display:flex;align-items:flex-start;gap:8px;padding:10px}
.post-chk{margin-top:2px;width:15px;height:15px;accent-color:var(--accent);flex-shrink:0}
.post-id{font-size:10px;font-weight:900;text-transform:uppercase;color:var(--accent);letter-spacing:.05em}
.post-dist{font-size:8px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-top:2px}
.post-coords{font-size:8px;color:var(--dim);font-weight:600;margin-top:1px}

.post-wa{
  width:30px;height:30px;border-radius:var(--r-xs);
  background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);
  color:var(--green2);display:grid;place-items:center;flex-shrink:0;
}
.post-wa svg{width:14px;height:14px}

.post-map{height:120px;width:100%;border:0;filter:grayscale(15%) contrast(1.05)}

.ctrl-send{
  width:100%;min-height:38px;border-radius:var(--r-xs);
  background:linear-gradient(135deg,var(--green),#059669);color:#fff;font-size:10px;font-weight:900;
  text-transform:uppercase;letter-spacing:.08em;
  display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 4px 15px rgba(16,185,129,.3);
}
.ctrl-send:disabled{background:var(--dim);color:var(--muted);box-shadow:none}
.ctrl-send svg{width:14px;height:14px}

.ctrl-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;
}
.ctrl-label{
  font-size:8px;font-weight:800;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:4px;
}
.ctrl-select{
  border-radius:4px;border:1px solid var(--border2);background:var(--bg);color:#fff;
  padding:3px 18px 3px 6px;font-size:10px;font-weight:800;appearance:none;
}
.ctrl-chk{width:14px;height:14px;accent-color:var(--accent)}

.toast{
  position:fixed;bottom:calc(12px + var(--safe-b));left:50%;
  transform:translateX(-50%) translateY(10px);
  border-radius:var(--r-xs);border:1px solid var(--border2);
  background:var(--surface);padding:8px 14px;font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;z-index:99999;opacity:0;transition:all .15s ease;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{color:var(--accent);border-color:rgba(212,175,55,.4);box-shadow:0 0 15px var(--accent-glow)}
.toast.err{color:#fecaca;border-color:rgba(239,68,68,.4)}
</style>
</head>
<body>

<!-- Elemento de áudio sutil para feedback harmônico (O Segredo: Sintonia e Frequência) -->
<audio id="toneSync" preload="auto">
  <source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" type="audio/ogg">
</audio>

<header class="hdr">
  <div class="hdr-in">
    <div class="hdr-title">Apoio Técnico</div>
    <div class="hdr-freq">Frequência: Alinhada</div>
  </div>
</header>

<div class="wrap">

  <!-- PESQUISA ID / KM (O Processo Criativo: Peça, Acredite, Receba) -->
  <div class="section-block">
    <div class="card card-accent">
      <div class="search-row">
        <div class="search-wrap">
          <input class="search-input" id="inputId" placeholder="PEÇA O ID (8 DÍGITOS)" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')searchId()">
        </div>
        <button class="btn-icon go" onclick="searchId()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
        <button class="btn-icon clr" onclick="clearId()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div id="searchMsg" class="search-msg" style="display:none"></div>
      <div id="searchResult" style="display:none;margin-top:8px"></div>
    </div>

    <div class="card card-accent">
      <div class="search-row">
        <div class="search-wrap">
          <input class="search-input" id="inputKm" placeholder="BUSQUE O KM (EX: 115)" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')searchKm()">
        </div>
        <button class="btn-icon go" onclick="searchKm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></button>
        <button class="btn-icon clr" onclick="clearKm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div id="searchKmMsg" class="search-msg" style="display:none"></div>
      <div id="searchKmModal" style="display:none"></div>
      <div id="searchKmResult" style="display:none;margin-top:8px"></div>
    </div>
  </div>

  <!-- PROXIMIDADE & GPS (O GPS interno / Lei da Atração) -->
  <div class="section-block">
    <div class="km-hero">
      <div class="km-value" id="kmVal">—</div>
      <div><span class="km-br-badge" id="kmBrBadge">SINTONIZANDO...</span></div>
    </div>

    <div id="gpsStatus" class="gps bad">GPS · BUSCANDO SINAL</div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <span style="font-size:8px;font-weight:900;text-transform:uppercase;color:var(--muted)">Mapa Operacional</span>
        <button class="coord-btn-toggle" onclick="toggleCoordSearch()">Coordenadas</button>
      </div>

      <div id="coordSearchBox" class="coord-container" style="display:none;">
        <div class="coord-inputs">
          <input class="coord-input" id="inputLat" placeholder="LAT" autocomplete="off" spellcheck="false">
          <input class="coord-input" id="inputLon" placeholder="LON" autocomplete="off" spellcheck="false">
        </div>
        <div style="display:flex;gap:4px;">
          <button class="ctrl-send" style="min-height:30px;font-size:9px;" onclick="searchManualCoord()">Calcular</button>
          <button class="btn-icon clr" onclick="clearCoordFields()" style="width:30px;height:30px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        
        <div class="map-box" id="mapBox">
          <div class="map-ctrls">
            <button class="map-btn active" id="btnLayerSat" onclick="setMapLayer('sat')">Sat</button>
            <button class="map-btn" id="btnLayerNorm" onclick="setMapLayer('norm')">Norm</button>
            <button class="map-btn" onclick="toggleFullscreen()">Full</button>
          </div>
          <div id="leafletMap" style="width:100%;height:100%;"></div>
        </div>
        <button class="ctrl-send" style="min-height:30px;font-size:9px;background:var(--violet);" onclick="useCurrentGps()">Usar GPS Atual</button>
      </div>

      <button id="btnSend" class="ctrl-send" disabled style="margin-top:8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        Manifestar via WhatsApp
      </button>

      <div class="ctrl-row">
        <label class="ctrl-label">
          Qtd:
          <select class="ctrl-select" id="qty">
            <option value="1">1</option>
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>
        </label>
        <label class="ctrl-label">
          <input type="checkbox" class="ctrl-chk" id="chkMaps" checked> Maps
        </label>
      </div>
    </div>

    <div id="postList" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

</div>

<div class="toast" id="toast" aria-live="polite"></div>

<!-- Leaflet JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
const norm=s=>String(s||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9_ ]+/g,' ').replace(/\s+/g,' ');
const parsePt=v=>{const s=String(v??'').trim();return/,\d+$/.test(s)?Number(s.replace(/\./g,'').replace(',','.')):Number(s)};
const hav=(a,b,c,d)=>{const p=Math.PI/180,x=.5-Math.cos((c-a)*p)/2+Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;return 12742000*Math.asin(Math.sqrt(x))};
const range=dist=>`${Math.max(0,Math.round(dist))}M`;
const nowBR=()=>new Date().toLocaleString('pt-BR').toUpperCase();
function findCol(h,cs){const m=h.map(norm);for(const c of cs){const i=m.indexOf(norm(c));if(i>=0)return i}return-1}

function playSyncTone(){
  try{
    const audio = document.getElementById('toneSync');
    if(audio){ audio.currentTime = 0; audio.volume = 0.2; audio.play().catch(()=>{}); }
  }catch(e){}
}

let posts=[], postIndex=new Map();
let kmDB_SP=[], kmDB_RJ=[], kmDB_BR101_SP=[], kmDB_BR101_RJ=[];
let pos=null, searchItem=null, searchKmItems=[], renderedKey='';
let mapInstance=null, mapMarker=null, mapLayerObj=null;

function showToast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.className='toast '+type;el.textContent=msg;
  requestAnimationFrame(()=>{el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500)});
}

function gpsBadge(el,p,err){
  const a=p?.acc;let cls='bad',txt;
  if(err)txt=err;
  else if(!a)txt='SINTONIZANDO GPS...';
  else if(a<=15) {cls='ok';txt=`GPS ALINHADO (±${Math.round(a)}M)`;}
  else {cls='warn';txt=`GPS CAPTANDO (±${Math.round(a)}M)`;}
  el.className='gps '+cls;el.textContent=txt;
}

async function fetchCSV(files){
  for(const f of files){
    try{
      let r=await fetch(f+'?v='+Date.now(),{cache:'force-cache'});
      if(r?.ok){let t=await r.text();if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);return t;}
    }catch(e){}
  }
  return null;
}

async function loadSystemData(){
  try{
    let t=await fetchCSV(['dados.csv','Dados_Completos_Grupo_2_all.csv']);
    if(t){
      let lines=t.split(/\r?\n/).filter(l=>l.trim());
      let h=lines.shift().split(';');
      let iId=findCol(h,['id do nox','idnox','id']),iLat=findCol(h,['latitude','lat']),iLon=findCol(h,['longitude','lon','long']);
      posts=lines.map(l=>{
        let r=l.split(';');
        return {id:String(r[iId]||'').trim().toUpperCase(), lat:parsePt(r[iLat]), lon:parsePt(r[iLon])};
      }).filter(p=>p.id&&Number.isFinite(p.lat)&&Number.isFinite(p.lon));

      postIndex.clear();
      posts.forEach(p=>postIndex.set(p.id, p));
    }

    let [tSP, tRJ, t101SP, t101RJ] = await Promise.all([
      fetchCSV(['SNVBR116SPRJ.csv','br116sp.csv','BR116_SP.csv']),
      fetchCSV(['SNVBR116RJ.csv','br116rj.csv','BR116_RJ.csv']),
      fetchCSV(['br101sp.csv','BR101_SP.csv']),
      fetchCSV(['br101rj.csv','BR101_RJ.csv'])
    ]);

    kmDB_SP = await parseKmFile(tSP);
    kmDB_RJ = await parseKmFile(tRJ);
    kmDB_BR101_SP = await parseKmFile(t101SP);
    kmDB_BR101_RJ = await parseKmFile(t101RJ);
  }catch(e){}

  initMap(-22.8512, -43.7744);
  renderApoio();

  if('geolocation' in navigator) navigator.geolocation.watchPosition(p=>{
    pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
    gpsBadge(document.getElementById('gpsStatus'),pos);
    renderApoio();
    updateKm();
    if(searchItem) updateSearchDist();
    if(searchKmItems.length) updateSearchKmDist();
  },null,{enableHighAccuracy:true,maximumAge:0,timeout:5000});
}

async function parseKmFile(text){
  if(!text)return [];
  let lines=text.split(/\r?\n/).filter(l=>l.trim());
  let h=lines.shift().split(';');
  let iKm=findCol(h,['km']),iLat=findCol(h,['lat','latitude']),iLon=findCol(h,['lon','long','longitude']);
  return lines.map(l=>{
    let r=l.split(';');
    return {km:parsePt(r[iKm]),lat:parsePt(r[iLat]),lon:parsePt(r[iLon])};
  }).filter(p=>Number.isFinite(p.km)&&Number.isFinite(p.lat)&&Number.isFinite(p.lon));
}

function findNearestInAnyDB(lat, lon){
  let candidates=[
    {name:'BR116/SP', db:kmDB_SP},
    {name:'BR116/RJ', db:kmDB_RJ},
    {name:'BR101/SP', db:kmDB_BR101_SP},
    {name:'BR101/RJ', db:kmDB_BR101_RJ}
  ].map(c=>{
    let best=null, bd=Infinity;
    for(let p of c.db){
      if(Math.abs(p.lat - lat) > 0.4 || Math.abs(p.lon - lon) > 0.4) continue;
      let d=hav(lat, lon, p.lat, p.lon);
      if(d<bd){bd=d;best={...p,d};}
    }
    return {name:c.name, res:best};
  }).filter(c=>c.res!==null);

  if(!candidates.length)return null;
  candidates.sort((a,b)=>a.res.d - b.res.d);
  return candidates[0];
}

function updateKm(){
  if(!pos)return;
  let best=findNearestInAnyDB(pos.lat, pos.lon);
  if(!best)return;
  let kmValStr=(Math.round(best.res.km*100)/100).toFixed(2).replace('.',',');
  document.getElementById('kmVal').textContent = `KM ${kmValStr}`;
  document.getElementById('kmBrBadge').textContent = best.name;
}

function findPostExactKm(post){
  let dbs=[{name:'SP', db:kmDB_SP},{name:'RJ', db:kmDB_RJ},{name:'BR101-SP', db:kmDB_BR101_SP},{name:'BR101-RJ', db:kmDB_BR101_RJ}];
  for(let dbObj of dbs){
    if(dbObj.db.length){
      let best=null, bd=Infinity;
      for(let pt of dbObj.db){
        if(Math.abs(pt.lat - post.lat) > 0.3 || Math.abs(pt.lon - post.lon) > 0.3) continue;
        let d=hav(post.lat, post.lon, pt.lat, pt.lon);
        if(d<bd){bd=d;best=pt;}
      }
      if(best && bd < 3000){
        return (Math.round(best.km*1000)/1000).toFixed(3).replace('.',',') + ' ('+dbObj.name+')';
      }
    }
  }
  return '---';
}

function initMap(lat, lon){
  if(mapInstance) return;
  mapInstance = L.map('leafletMap', {zoomControl:false, attributionControl:false}).setView([lat, lon], 14);
  setMapLayer('sat');
  mapMarker = L.marker([lat, lon]).addTo(mapInstance);
  mapInstance.on('click', e=>{
    let l = e.latlng;
    document.getElementById('inputLat').value = l.lat.toFixed(6);
    document.getElementById('inputLon').value = l.lng.toFixed(6);
    mapMarker.setLatLng([l.lat, l.lng]);
  });
}

function setMapLayer(mode){
  document.getElementById('btnLayerSat').classList.toggle('active', mode==='sat');
  document.getElementById('btnLayerNorm').classList.toggle('active', mode==='norm');
  if(!mapInstance) return;
  if(mapLayerObj) mapInstance.removeLayer(mapLayerObj);
  if(mode==='sat'){
    mapLayerObj = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19});
  }else{
    mapLayerObj = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19});
  }
  mapLayerObj.addTo(mapInstance);
}

function toggleFullscreen(){
  let box = document.getElementById('mapBox');
  box.classList.toggle('fullscreen');
  if(mapInstance) setTimeout(()=>mapInstance.invalidateSize(), 50);
}

function toggleCoordSearch(){
  let box = document.getElementById('coordSearchBox');
  let isH = box.style.display==='none';
  box.style.display = isH ? 'flex' : 'none';
  if(isH && mapInstance) setTimeout(()=>mapInstance.invalidateSize(), 50);
}

function useCurrentGps(){
  if(!pos){showToast('Sinal GPS ausente','err');return;}
  document.getElementById('inputLat').value = pos.lat.toFixed(6);
  document.getElementById('inputLon').value = pos.lon.toFixed(6);
  mapInstance.setView([pos.lat, pos.lon], 16);
  mapMarker.setLatLng([pos.lat, pos.lon]);
  playSyncTone();
}

function clearCoordFields(){
  document.getElementById('inputLat').value='';
  document.getElementById('inputLon').value='';
}

function searchManualCoord(){
  let lat = parsePt(document.getElementById('inputLat').value);
  let lon = parsePt(document.getElementById('inputLon').value);
  if(isNaN(lat)||isNaN(lon)){showToast('Coordenada inválida','err');return;}
  mapInstance.setView([lat, lon], 16);
  mapMarker.setLatLng([lat, lon]);
  showToast('Coordenada sintonizada');
  playSyncTone();
}

function searchId(){
  let raw = document.getElementById('inputId').value.trim();
  let msg = document.getElementById('searchMsg'), res = document.getElementById('searchResult');
  if(!raw){clearId();return;}

  let found = postIndex.get(norm(raw));
  if(!found){
    for(let [k,v] of postIndex.entries()){
      if(k.includes(norm(raw))){found=v;break;}
    }
  }

  if(!found){
    msg.style.display='flex';msg.textContent='Frequência não encontrada';
    searchItem=null;res.style.display='none';return;
  }

  searchItem=found;
  msg.style.display='none';
  renderSearch();
  showToast('Manifestado com sucesso');
  playSyncTone();
}

function clearId(){
  document.getElementById('inputId').value='';
  document.getElementById('searchMsg').style.display='none';
  document.getElementById('searchResult').style.display='none';
  searchItem=null;
}

function updateSearchDist(){
  if(!searchItem||!pos)return;
  let el=document.getElementById('srch-dist');
  if(el)el.textContent='Dist: '+range(hav(pos.lat,pos.lon,searchItem.lat,searchItem.lon));
}

function renderSearch(){
  if(!searchItem)return;
  let res=document.getElementById('searchResult');
  let dt='Sintonizando GPS...';
  if(pos) dt='Dist: '+range(hav(pos.lat,pos.lon,searchItem.lat,searchItem.lon));
  
  res.style.display='block';
  res.innerHTML=`<div class="post searched">
    <div class="post-top">
      <div style="flex:1;">
        <p class="post-id">ID: ${searchItem.id}</p>
        <p class="post-dist" style="color:var(--accent);font-weight:900;">KM: ${findPostExactKm(searchItem)}</p>
        <p class="post-dist" id="srch-dist">${dt}</p>
        <p class="post-coords">${searchItem.lat.toFixed(5)}, ${searchItem.lon.toFixed(5)}</p>
      </div>
      <button class="post-wa" onclick="sendWhatsApp('${searchItem.id}', ${searchItem.lat}, ${searchItem.lon})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </button>
    </div>
    <div style="padding:0 8px 8px;"><iframe class="post-map" src="https://maps.google.com/maps?q=${searchItem.lat},${searchItem.lon}&t=k&z=19&output=embed" loading="lazy"></iframe></div>
  </div>`;
}

function searchKm(){
  let raw=document.getElementById('inputKm').value;
  let target=parsePt(raw);
  let msg=document.getElementById('searchKmMsg'),res=document.getElementById('searchKmResult');
  let modal=document.getElementById('searchKmModal');
  modal.style.display='none';

  if(isNaN(target)){clearKm();return;}
  if(!posts.length||(!kmDB_SP.length&&!kmDB_RJ.length)){
    msg.style.display='flex';msg.textContent='Carregando bases';return;
  }

  let db = kmDB_SP.length ? kmDB_SP : kmDB_RJ;
  let bestPt=null, minDiff=Infinity;
  for(let pt of db){
    let diff=Math.abs(pt.km - target);
    if(diff<minDiff){minDiff=diff;bestPt=pt;}
  }

  if(!bestPt){
    msg.style.display='flex';msg.textContent='KM fora do alcance';
    searchKmItems=[];res.style.display='none';return;
  }

  let sorted = posts.map(p=>({
    ...p, d: (Math.abs(p.lat - bestPt.lat) > 0.2 || Math.abs(p.lon - bestPt.lon) > 0.2) ? 999999 : hav(bestPt.lat, bestPt.lon, p.lat, p.lon)
  })).sort((a,b)=>a.d - b.d).slice(0, 10);

  searchKmItems=sorted;
  msg.style.display='none';
  renderSearchKm();
  showToast('Frequência de KM sintonizada');
  playSyncTone();
}

function clearKm(){
  document.getElementById('inputKm').value='';
  document.getElementById('searchKmMsg').style.display='none';
  document.getElementById('searchKmResult').style.display='none';
  searchKmItems=[];
}

function updateSearchKmDist(){
  if(!searchKmItems.length||!pos)return;
  searchKmItems.forEach((item, idx)=>{
    let el=document.getElementById('srch-km-dist-'+idx);
    if(el)el.textContent='Dist: '+range(hav(pos.lat,pos.lon,item.lat,item.lon));
  });
}

function renderSearchKm(){
  if(!searchKmItems.length)return;
  let res=document.getElementById('searchKmResult');
  res.style.display='block';
  
  let html='<div style="display:flex;flex-direction:column;gap:8px">';
  searchKmItems.forEach((item, idx)=>{
    let dt=pos?'Dist: '+range(hav(pos.lat,pos.lon,item.lat,item.lon)):'--';
    html+=`<div class="post searched">
      <div class="post-top">
        <div style="flex:1;">
          <p class="post-id">#${idx+1} - ID: ${item.id}</p>
          <p class="post-dist" style="color:var(--accent);font-weight:900;">KM: ${findPostExactKm(item)}</p>
          <p class="post-dist" id="srch-km-dist-${idx}">${dt}</p>
          <p class="post-coords">${item.lat.toFixed(5)}, ${item.lon.toFixed(5)}</p>
        </div>
        <button class="post-wa" onclick="sendWhatsApp('${item.id}', ${item.lat}, ${item.lon})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </button>
      </div>
      <div style="padding:0 8px 8px;"><iframe class="post-map" src="https://maps.google.com/maps?q=${item.lat},${item.lon}&t=k&z=19&output=embed" loading="lazy"></iframe></div>
    </div>`;
  });
  html+='</div>';
  res.innerHTML=html;
}

function sendWhatsApp(id, lat, lon){
  let tx = `📍 *POSTE*\nID: ${id}\nCoords: ${Number(lat).toFixed(5)}, ${Number(lon).toFixed(5)}\nhttps://maps.google.com/?q=${Number(lat).toFixed(5)},${Number(lon).toFixed(5)}`;
  window.open('https://wa.me/?text='+encodeURIComponent(tx),'_blank','noopener');
  playSyncTone();
}

function renderApoio(){
  if(!pos||!posts.length)return;
  let qty=Number(document.getElementById('qty').value||10);
  let items=posts.map(p=>{
    if(Math.abs(p.lat - pos.lat) > 0.3 || Math.abs(p.lon - pos.lon) > 0.3) return null;
    return {id:p.id, lat:p.lat, lon:p.lon, d:hav(pos.lat,pos.lon,p.lat,p.lon)};
  }).filter(Boolean).sort((a,b)=>a.d-b.d).slice(0,qty);

  let key=items.map(i=>i.id).join(',');
  let list=document.getElementById('postList');

  if(key===renderedKey){
    items.forEach((o,i)=>{
      let el=document.getElementById('dist-'+i);
      if(el)el.textContent='Dist: '+range(o.d);
    });
    document.getElementById('btnSend').disabled=false;
    return;
  }

  renderedKey=key;
  let frag=document.createDocumentFragment();

  items.forEach((o,i)=>{
    let div=document.createElement('div');
    div.className='post'+(i===0?' near':'');
    div.innerHTML=`<div class="post-top">
      <input type="checkbox" class="post-chk" value="${o.id}" data-lat="${o.lat}" data-lon="${o.lon}" checked>
      <div style="flex:1;">
        <p class="post-id">ID: ${o.id}</p>
        <p class="post-dist" style="color:var(--accent);font-weight:900;">KM: ${findPostExactKm(o)}</p>
        <p class="post-dist" id="dist-${i}">Dist: ${range(o.d)}</p>
      </div>
      <button class="post-wa" onclick="sendWhatsApp('${o.id}', ${o.lat}, ${o.lon})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </button>
    </div>
    <div style="padding:0 8px 8px;"><iframe class="post-map" src="https://maps.google.com/maps?q=${o.lat},${o.lon}&t=k&z=19&output=embed" loading="lazy"></iframe></div>`;
    frag.appendChild(div);
  });

  list.innerHTML='';
  list.appendChild(frag);
  document.getElementById('btnSend').disabled=false;
}

document.getElementById('btnSend').onclick=()=>{
  if(!pos)return;
  let chks=document.querySelectorAll('.post-chk:checked');
  let items=[];
  if(chks.length){
    chks.forEach(c=>items.push({id:c.value,lat:parseFloat(c.dataset.lat),lon:parseFloat(c.dataset.lon)}));
  }else{
    let qty=Number(document.getElementById('qty').value||10);
    items=posts.map(p=>({...p,d:hav(pos.lat,pos.lon,p.lat,p.lon)})).sort((a,b)=>a.d-b.d).slice(0,qty);
  }
  let tx=`📍 *MANIFESTAÇÃO DE OPERAÇÃO*\nData: ${nowBR()}\n\n`;
  items.forEach((o,i)=>{
    tx+=`${i+1}. ID: ${o.id} (KM: ${findPostExactKm(o)})\n`;
    if(document.getElementById('chkMaps').checked) tx+=`   https://maps.google.com/?q=${o.lat.toFixed(5)},${o.lon.toFixed(5)}\n`;
  });
  window.open('https://wa.me/?text='+encodeURIComponent(tx),'_blank','noopener');
  showToast('Manifestado com sucesso');
  playSyncTone();
};

document.getElementById('qty').onchange=()=>{renderedKey='';renderApoio()};

window.addEventListener('DOMContentLoaded', loadSystemData);
</script>
